<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="윤석희 웹디자인 포트폴리오">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>YOON SEOK HEE — Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="home-page is-intro-loading">
  <div class="site-shell home-shell">
    <header class="site-header home-header">
      <a class="brand" href="index.html" aria-label="홈으로 이동">
        <strong>YOON SEOK HEE</strong>
        <span>WEB DESIGNER / PUBLISHER</span>
      </a>

      <nav class="site-nav" aria-label="주요 메뉴">
        <a href="projects.html">PROJECTS</a>
        <a href="about.html">ABOUT</a>
        <a href="about.html#contact">CONTACT</a>
      </nav>
    </header>

    <main class="home-main">
      <section class="hero" id="home">
        <div class="intro-vignette" aria-hidden="true"></div>

        <div class="depth-bg" id="depthBg" aria-hidden="true">
          <canvas class="depth-canvas" id="depthCanvas"></canvas>
          <div class="depth-glow depth-glow-a"></div>
          <div class="depth-glow depth-glow-b"></div>
        </div>

        <!-- 현재 탐색 중인 카테고리 -->
        <div class="hero-copy" aria-live="polite">
          <div class="hero-index-wrap hero-reveal hero-reveal-1">
            <span id="heroIndex">01</span>
            <i></i>
          </div>

          <p class="hero-kicker hero-reveal hero-reveal-2">SELECT CATEGORY</p>
          <h1 class="hero-reveal hero-reveal-3" id="heroTitle">WEB DESIGN</h1>
          <p class="hero-desc hero-reveal hero-reveal-4" id="heroDescription">웹사이트 기획 · 디자인 · 퍼블리싱</p>
        </div>

        <!-- 사용법은 설명 카드 대신 한 줄로만 -->
        <div class="home-explore-hint" id="interactionGuide" aria-label="포트폴리오 이용 방법">
          <span class="home-explore-pulse"></span>
          <span><b>SCROLL</b> TO BROWSE</span>
          <i></i>
          <span><b>CLICK RECORD</b> TO VIEW ALL</span>
        </div>

        <div class="record-stage" id="recordStage" aria-label="포트폴리오 카테고리 선택">

          <button class="record-wrap" id="recordButton" type="button" aria-label="선택한 카테고리 작품 보기">
            <span class="record-intro-pulse" aria-hidden="true"></span>
            <span class="record-intro-scan" aria-hidden="true"></span>

            <div class="record" id="record" aria-hidden="true">
              <div class="record-ring ring-1"></div>
              <div class="record-ring ring-2"></div>
              <div class="record-ring ring-3"></div>

              <!-- ORIGINAL LP LABEL — 단순한 레코드 라벨 구조로 복원 -->
              <div class="record-label">
                <svg class="record-label-svg" viewBox="0 0 200 200" aria-hidden="true">
                  <defs>
                    <path id="labelTopArc" d="M 34 102 A 66 66 0 0 1 166 102" />
                    <path id="labelBottomArc" d="M 166 110 A 66 66 0 0 1 34 110" />
                  </defs>

                  <text class="label-arc label-arc-top">
                    <textPath href="#labelTopArc" startOffset="50%" text-anchor="middle">
                      YOON SEOK HEE
                    </textPath>
                  </text>

                  <text class="label-arc label-arc-bottom">
                    <textPath href="#labelBottomArc" startOffset="50%" text-anchor="middle">
                      PORTFOLIO
                    </textPath>
                  </text>

                  <text class="label-year label-year-left"
                        x="48" y="105"
                        text-anchor="middle">20</text>

                  <text class="label-year label-year-right"
                        x="152" y="105"
                        text-anchor="middle">26</text>

                  <circle class="label-hole-ring" cx="100" cy="100" r="10"></circle>
                  <circle class="label-hole" cx="100" cy="100" r="5.7"></circle>
                </svg>
              </div>
            </div>

            <span class="record-pointer-light" aria-hidden="true"></span>
            <span class="record-hover-cta" aria-hidden="true">
              <span id="recordHoverText">VIEW ALL WEB DESIGN</span><b>↗</b>
            </span>
          </button>

          <div class="category-orbit" id="categoryOrbit" aria-label="카테고리"></div>
        </div>

        <!-- 클릭 전에도 바로 보이는 현재 카테고리 작업물 -->
        <aside class="home-selected-works" id="homeSelectedWorks" aria-live="polite">
          <div class="home-selected-head">
            <div>
              <span>SELECTED WORKS</span>
              <strong id="homeSelectedCategory">WEB DESIGN</strong>
            </div>
            <span class="home-selected-count" id="homeSelectedCount">00</span>
          </div>

          <div class="home-selected-list" id="homeSelectedList"></div>

          <a class="home-selected-all" id="homeSelectedAll" href="projects.html?category=web">
            VIEW ALL PROJECTS <span>↗</span>
          </a>
        </aside>

        <section class="preview-panel" id="previewPanel" aria-hidden="true">
          <div class="preview-head">
            <div class="preview-heading">
              <span class="section-label">SELECTED WORKS</span>
              <h2 id="previewTitle">WEB DESIGN</h2>
            </div>

            <button class="preview-close" id="previewClose" type="button" aria-label="프로젝트 패널 닫기">
              CLOSE <span>×</span>
            </button>
          </div>

          <div class="preview-grid" id="previewGrid"></div>

          <div class="preview-more-wrap">
            <a class="text-link" id="previewMore" href="projects.html">
              VIEW ALL <span class="preview-count" id="previewCount">00</span> <span>→</span>
            </a>
          </div>
        </section>
      </section>
    </main>
  </div>

  <script src="data/projects-data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
